<div class="app" [class.app--sem-nav]="!autenticado()">
  @if (atualizacao.disponivel()) {
    <div class="versao" role="status">
      <span>Nova versão disponível</span>
      <button class="botao botao--primario botao--curto" type="button" (click)="atualizacao.recarregar()">
        Atualizar
      </button>
    </div>
  }

  @if (autenticado()) {
    <nav class="nav" aria-label="Navegação principal">
      <span class="nav__marca">Tasky</span>

      <div class="nav__trilho" appBarraDeslizavel>
        <span class="nav__pilula" aria-hidden="true"></span>
        <ul class="nav__lista">
          @for (item of itens; track item.rota) {
            <li>
              <a
                class="nav__item"
                [routerLink]="item.rota"
                routerLinkActive="nav__item--ativo"
                [attr.aria-label]="item.rotulo"
              >
                <app-icone [nome]="item.icone" [tamanho]="24" />
                <span class="nav__rotulo">{{ item.rotulo }}</span>
              </a>
            </li>
          }
        </ul>
      </div>

      <div class="nav__rodape">
        <span class="nav__usuario">{{ usuario()?.nome }}</span>
        <button class="nav__sair" type="button" (click)="sair()">Sair</button>
      </div>
    </nav>
  }

  <main class="conteudo">
    <router-outlet />
  </main>
</div>
