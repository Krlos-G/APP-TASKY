<main class="login">
  <div class="login__cartao">
    <h1 class="login__marca">Tasky</h1>
    <p class="login__subtitulo">Sua rotina, hábitos e tarefas do dia.</p>

    <form class="login__form" [formGroup]="formulario" (ngSubmit)="entrar()">
      <label class="campo">
        <span class="campo__rotulo">E-mail</span>
        <input
          class="campo__entrada"
          type="email"
          formControlName="email"
          autocomplete="username"
          inputmode="email"
          autocapitalize="none"
          spellcheck="false"
          [attr.aria-invalid]="formulario.controls.email.touched && formulario.controls.email.invalid"
        />
        @if (formulario.controls.email.touched && formulario.controls.email.invalid) {
          <span class="campo__erro">Informe um e-mail válido.</span>
        }
      </label>

      <label class="campo">
        <span class="campo__rotulo">Senha</span>
        <input
          class="campo__entrada"
          type="password"
          formControlName="senha"
          autocomplete="current-password"
          [attr.aria-invalid]="formulario.controls.senha.touched && formulario.controls.senha.invalid"
        />
        @if (formulario.controls.senha.touched && formulario.controls.senha.invalid) {
          <span class="campo__erro">Informe a senha.</span>
        }
      </label>

      @if (erro()) {
        <p class="login__falha" role="alert">{{ erro() }}</p>
      }

      <button class="login__botao" type="submit" [disabled]="enviando()">
        {{ enviando() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>
  </div>
</main>
