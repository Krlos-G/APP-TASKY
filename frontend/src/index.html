<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Tasky</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Rotina, hábitos e tarefas do dia." />
    <!-- A faixa do relogio na cor do fundo do app, em cada tema. -->
    <meta name="theme-color" content="#eef2fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070912" media="(prefers-color-scheme: dark)" />

    <!-- iOS: necessario para o app abrir em tela cheia quando adicionado a tela de inicio. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- O app ocupa a tela inteira, com o fundo passando por baixo do relogio. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tasky" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />

    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>É necessário habilitar o JavaScript para usar o Tasky.</noscript>
  </body>
</html>
